<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			const saved = localStorage.getItem('theme');
			if (saved !== 'light') {
				document.documentElement.classList.add('dark');
			}
		</script>
		%sveltekit.head%

		<!-- Google AdSense -->
		<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3754634116997255" crossorigin="anonymous"></script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
